name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Test Applications
    runs-on: ubuntu-latest

    services:
      # Configurar serviço de banco de dados para os testes E2E do NestJS
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rec
          POSTGRES_PASSWORD: rec
          POSTGRES_DB: rec_flight
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Configurar cache Redis para o NestJS
      cache:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate
        env:
          DATABASE_URL: postgresql://rec:rec@localhost:5432/rec_flight?schema=public

      - name: Run Prisma Migrations
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://rec:rec@localhost:5432/rec_flight?schema=public

      - name: Run Linter
        run: pnpm run lint

      - name: Run Backend Unit Tests
        run: pnpm --filter api test
        env:
          DATABASE_URL: postgresql://rec:rec@localhost:5432/rec_flight?schema=public

      - name: Run Backend E2E Tests
        run: pnpm --filter api test:e2e
        env:
          DATABASE_URL: postgresql://rec:rec@localhost:5432/rec_flight?schema=public
          REDIS_URL: redis://localhost:6379

      - name: Run Frontend Unit & Property Tests
        run: pnpm --filter web test

      - name: Build Frontend Application
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_API_WS_URL: http://localhost:3001
          NEXT_STANDALONE: true
