services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # REST: Next.js server-side usa o nome do serviço Docker interno
      - NEXT_PUBLIC_API_URL=http://api:3001
      # WebSocket: o browser do usuário conecta via localhost (não via rede interna Docker)
      - NEXT_PUBLIC_API_WS_URL=http://localhost:3001
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://rec:rec@db:5432/rec_flight?schema=public
      - REDIS_URL=redis://cache:6379
      - PORT=3001
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=rec
      - POSTGRES_PASSWORD=rec
      - POSTGRES_DB=rec_flight
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rec -d rec_flight"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
