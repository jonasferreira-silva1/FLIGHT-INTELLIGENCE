services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # REST: Next.js server-side usa o nome do serviço Docker interno
      - NEXT_PUBLIC_API_URL=http://api:3001
      # WebSocket: o browser do usuário conecta via localhost (não via rede interna Docker)
      - NEXT_PUBLIC_API_WS_URL=http://localhost:3001
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - flight-network
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-rec}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@db:5432/${POSTGRES_DB:-rec_flight}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Defina REDIS_PASSWORD no arquivo .env}@cache:6379
      - PORT=3001
      - ML_SERVICE_URL=http://ml:8000
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - flight-network
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  ml:
    build:
      context: ./apps/ml
      dockerfile: Dockerfile
    # Exposição estrita em loopback (127.0.0.1) para evitar escuta pública em 0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - flight-network

  cache:
    image: redis:7-alpine
    # Exposição estrita em loopback (127.0.0.1) para depuração local segura
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Defina REDIS_PASSWORD no arquivo .env}"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - flight-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no arquivo .env} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    # Exposição estrita em loopback (127.0.0.1) para ferramentas de banco locais
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-rec}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      - POSTGRES_DB=${POSTGRES_DB:-rec_flight}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - flight-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rec} -d ${POSTGRES_DB:-rec_flight}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  flight-network:
    driver: bridge

volumes:
  postgres_data:
